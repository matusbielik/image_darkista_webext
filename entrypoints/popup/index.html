<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Image Adjuster</title>
  <style>
    body {
      /* Base styles */
      width: 300px;
      padding: 15px;
      font-family: system-ui, sans-serif;
      /* Dark Theme */
      background-color: #282828;
      /* Dark gray, similar to overlay */
      color: #eee;
      /* Light text color */
      box-sizing: border-box;
    }

    h3 {
      color: #eee;
      /* Ensure heading is light */
      margin-top: 0;
      /* Remove default top margin */
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      /* Light border */
      padding-bottom: 8px;
    }

    .settings-section {
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      /* Light border */
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .control-group label {
      margin-bottom: 0;
      /* Remove bottom margin for inline labels */
      color: #ccc;
      /* Slightly dimmer label text */
      font-size: 0.9em;
    }

    /* Style checkboxes for dark theme */
    input[type="checkbox"] {
      accent-color: #69f;
      /* Accent color for the checkmark */
    }

    .slider-container {
      margin-bottom: 15px;
      opacity: 1;
      transition: opacity 0.3s;
    }

    .slider-container.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    label[for="invert"],
    label[for="hue"] {
      display: block;
      margin-bottom: 5px;
      color: #eee;
      /* Ensure slider labels are light */
      font-size: 0.95em;
    }

    /* Style sliders for dark theme */
    input[type="range"] {
      width: 100%;
      cursor: pointer;
      accent-color: #69f;
      /* Match checkbox accent */
    }

    /* Style buttons for dark theme */
    .icon-button {
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      /* Light border */
      background-color: rgba(80, 80, 80, 0.8);
      /* Dark button background */
      color: #eee;
      /* Light icon/text color */
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s;
    }

    .icon-button:hover {
      background-color: rgba(100, 100, 100, 0.9);
      /* Slightly lighter on hover */
    }

    .icon-button.disabled {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="settings-section">
    <h3>Settings</h3>
    <div class="control-group">
      <input type="checkbox" id="enable-compact">
      <label for="enable-compact">Compact Mode (Icons Only)</label>
    </div>
    <div class="control-group">
      <input type="checkbox" id="enable-invert" checked>
      <label for="enable-invert">Invert Slider</label>
    </div>
    <div class="control-group">
      <input type="checkbox" id="enable-hue" checked>
      <label for="enable-hue">Hue Slider</label>
    </div>
    <div class="control-group">
      <input type="checkbox" id="enable-auto" checked>
      <label for="enable-auto">Auto-match Button</label>
    </div>
    <div class="control-group">
      <input type="checkbox" id="enable-similar" checked>
      <label for="enable-similar">Apply to Similar Button</label>
    </div>
    <div class="control-group">
      <input type="checkbox" id="enable-reset" checked>
      <label for="enable-reset">Reset Button</label>
    </div>
  </div>

  <div id="invert-container" class="slider-container">
    <label for="invert">Invert: <span id="invert-value">0.8</span></label>
    <input type="range" id="invert" min="0" max="1" step="0.1" value="0.8">
  </div>

  <div id="hue-container" class="slider-container">
    <label for="hue">Hue Rotation: <span id="hue-value">180</span>°</label>
    <input type="range" id="hue" min="0" max="360" step="10" value="180">
  </div>

  <div class="control-group">
    <button id="apply-all" class="icon-button" title="Apply to All Images">🖼️</button>
    <button id="reset-all" class="icon-button" title="Reset All Images">↺</button>
  </div>

  <script type="module" src="./main.ts"></script>
</body>

</html>
